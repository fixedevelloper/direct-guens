# /etc/nginx/sites-available/scrapper.guenstravel.com
# Version finale APRÈS émission du certificat (certbot certonly / --nginx).
# Zone de limitation de débit (contexte http : OK dans sites-enabled)
limit_req_zone $binary_remote_addr zone=flights_api:10m rate=10r/s;

# --- HTTP : certbot + redirection vers HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name scrapper.guenstravel.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS : proxy vers l'API ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name scrapper.guenstravel.com;

    ssl_certificate     /etc/letsencrypt/live/scrapper.guenstravel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scrapper.guenstravel.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    server_tokens off;

    access_log /var/log/nginx/scrapper.access.log;
    error_log  /var/log/nginx/scrapper.error.log;

    # Seule l'API est exposée ; la clé X-API-Key est vérifiée par l'application
    location /api/ {
        limit_req zone=flights_api burst=20 nodelay;

        # Optionnel : restreindre aux IP des applications clientes
        # allow 203.0.113.10;
        # deny  all;

        proxy_pass http://127.0.0.1:8776;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 1k;
    }

    # Statut minimal public (supervision)
    location = / { proxy_pass http://127.0.0.1:8776; }

    # Tout le reste (docs, openapi…) est refusé
    location / { return 404; }
}
