# /etc/nginx/sites-available/flights.example.com  (remplacer le sous-domaine partout)
# Zone de limitation de débit (à placer dans le contexte http : /etc/nginx/conf.d/ convient)
limit_req_zone $binary_remote_addr zone=flights_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name scrapper.guenstravel.com;

    # Nécessaire à certbot ; tout le reste est redirigé vers HTTPS
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name flights.example.com;

    # Certificats : renseignés automatiquement par `certbot --nginx -d flights.example.com`
    ssl_certificate     /etc/letsencrypt/live/flights.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flights.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    server_tokens off;

    access_log /var/log/nginx/flights.access.log;
    error_log  /var/log/nginx/flights.error.log;

    # Seule l'API est exposée ; la clé X-API-Key est vérifiée par l'application
    location /api/ {
        limit_req zone=flights_api burst=20 nodelay;

        # Optionnel : restreindre aux IP des applications clientes
        # allow 203.0.113.10;
        # deny  all;

        proxy_pass http://127.0.0.1:8776;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 1k;
    }

    # Statut minimal public (sondes de supervision)
    location = / { proxy_pass http://127.0.0.1:8776; }

    # Tout le reste (docs, openapi, etc.) est refusé
    location / { return 404; }
}
